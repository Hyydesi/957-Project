<body class="works-page">

<!-- RAIL (Figma 1557:3976): the red bar down the left edge — its darker head
     grows with the page as you scroll, and the button at its foot opens the
     menu (its two lines cross into a close) -->
<aside class="rail" aria-label="Site">
  <span class="rail__fill" id="railFill" aria-hidden="true"></span>
  <a class="rail__logo" href="index.html" aria-label="NINEFIVESEVEN — Home"><img src="assets/home/rail-logo.svg" alt=""></a>
  <button type="button" class="rail__menu" id="railMenu" aria-label="Open menu" aria-expanded="false" aria-controls="mpanel">
    <i></i><i></i>
  </button>
</aside>

<!-- NAV (Figma 1557:3976): a grey bar top-right with the three links and the
     red call button; with the menu open it drops the bar and the button turns
     white (Figma 1574:4469) -->
<nav class="hnav" id="nav" data-theme="dark" aria-label="Primary">
  <div class="hnav__links">
    <a href="works.html" data-cms="nav.work" data-cms-label="Mục 1" data-cms-group="Nav">Work</a>
    <a href="index.html#about" data-cms="nav.studio" data-cms-label="Mục 2" data-cms-group="Nav">Studio</a>
    <a href="index.html#contact" data-cms="nav.pricing" data-cms-label="Mục 3" data-cms-group="Nav">Pricing</a>
  </div>
  <button type="button" class="hnav__cta" data-contact-open data-cms="nav.cta" data-cms-label="Nút" data-cms-group="Nav">Book a call</button>
</nav>

<!-- MENU (Figma 1574:4469): a grey panel that opens out of the rail — a
     MENU tab, the four big links and the socials at its foot -->
<div class="mpanel" id="mpanel" role="dialog" aria-label="Menu" aria-hidden="true">
  <p class="mpanel__tab">Menu</p>
  <div class="mpanel__body">
    <nav class="mpanel__links">
      <a href="works.html" class="mpanel__link" data-cms="menu.link.work" data-cms-label="Mục 1" data-cms-group="Menu">Works</a>
      <a href="index.html#about" class="mpanel__link" data-cms="menu.link.about" data-cms-label="Mục 2" data-cms-group="Menu">About</a>
      <a href="index.html#services" class="mpanel__link" data-cms="menu.link.services" data-cms-label="Mục 3" data-cms-group="Menu">Services</a>
      <a href="#contact" class="mpanel__link" data-contact-open data-cms="menu.link.contact" data-cms-label="Mục 4" data-cms-group="Menu">Book a call</a>
    </nav>
    <ul class="mpanel__socials">
      <li><a href="#" data-cms="menu.social1.name" data-cms-href="menu.social1.url" data-cms-label="Mạng xã hội 1" data-cms-group="Menu">Instagram</a></li>
      <li><a href="#" data-cms="menu.social2.name" data-cms-href="menu.social2.url" data-cms-label="Mạng xã hội 2" data-cms-group="Menu">X / Twitter</a></li>
      <li><a href="#" data-cms="menu.social3.name" data-cms-href="menu.social3.url" data-cms-label="Mạng xã hội 3" data-cms-group="Menu">Behance</a></li>
      <li><a href="#" data-cms="menu.social4.name" data-cms-href="menu.social4.url" data-cms-label="Mạng xã hội 4" data-cms-group="Menu">LinkedIn</a></li>
    </ul>
  </div>
</div>

<main>

  <!-- WORK (Figma 1539:249) — the heading top-left over a full-screen still,
       an endless skewed carousel of project cards across the middle that the
       wheel, a drag or the arrows move a card at a time, the lead bottom-left
       and the project in the middle bottom-right (works.js) -->
  <section class="wstrip" id="wStrip" data-theme="dark">
    <div class="wstrip__sticky">
      <!-- the glow behind: React Bits' Gradient ASCII in the brand's reds
           (gradient-ascii.js, started by works.js) -->
      <div class="wstrip__bg" aria-hidden="true"></div>
      <h1 class="whero__title wstrip__title" data-cms="works.hero.title" data-cms-label="Tiêu đề" data-cms-group="Works hero">Handpicked from everything we've built</h1>
      <!-- the cards themselves (links, filled from projects.js); drawn on the
           canvas instead where WebGL is available -->
      <div class="wstrip__track" id="wStripTrack"></div>
      <canvas class="wstrip__gl" id="wStripGl" aria-hidden="true"></canvas>
      <span class="wstrip__shade" aria-hidden="true"></span>
      <!-- previous / next and a dot for each project (works.js) -->
      <div class="wstrip__controls">
        <button type="button" class="wstrip__step" data-step="-1" aria-label="Previous project"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
        <div class="wstrip__dots"></div>
        <button type="button" class="wstrip__step" data-step="1" aria-label="Next project"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
      </div>
      <!-- the project nearest the middle (works.js) -->
      <p class="wstrip__now" aria-live="polite"></p>
      <p class="wstrip__lead" data-cms="works.hero.lead" data-cms-label="Mô tả" data-cms-group="Works hero">We are a design agency helping teams design, build, and scale digital products that actually work and drive real impact.</p>
    </div>
  </section>


</main>

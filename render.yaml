# Render blueprint cho trang quản trị 957.
#
# Cách dùng: Render → New → Blueprint → chọn repo này. Render đọc file này,
# tạo web service, rồi hỏi bạn điền các giá trị bí mật. Không viết giá trị thật
# vào file này — nó nằm trên GitHub public.
services:
  - type: web
    name: 957-admin
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: node admin/server.js
    envVars:
      - key: NODE_VERSION
        value: "20"

      # chạy ở chế độ hosted: phục vụ bản clone của chính server
      - key: ADMIN_MODE
        value: hosted
      - key: SITE_DIR
        value: /tmp/957-site

      # repo website và nhánh mà admin sẽ đọc/ghi
      - key: GIT_REMOTE
        value: https://github.com/Hyydesi/957-Project.git
      - key: GIT_BRANCH
        value: main

      # nơi lưu danh sách thành viên — repo website là public nên email của
      # team không được để ở đó
      - key: CONFIG_DIR
        value: /tmp/957-admin-config
      - key: CONFIG_BRANCH
        value: main

      # Render tự sinh, giữ nguyên qua các lần deploy — giữ phiên đăng nhập
      - key: SESSION_SECRET
        generateValue: true

      # bạn tự điền trong dashboard, không lưu vào repo
      - key: OWNER_EMAIL
        sync: false          # gmail của bạn — luôn là owner, không xoá được
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false          # cần quyền Contents:RW trên CẢ HAI repo
      - key: CONFIG_REPO
        sync: false          # https://github.com/<bạn>/957-admin-config.git
